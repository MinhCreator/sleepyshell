# Every push to dev gets a Claude review. A newer push cancels the running one; the next run then reviews
# everything since the last completed review, so nothing is skipped.
# A manual run (gh workflow run dev.yml) reviews dev the same way, without a push.
name: dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions: {}

concurrency:
  group: review-dev
  cancel-in-progress: true

jobs:
  review:
    # a manual run reviews dev only: started on another branch it would label that branch's head as dev
    if: github.ref == 'refs/heads/dev'
    uses: ./.github/workflows/review.yml
    with:
      branch: dev
    secrets:
      ADVISORY_TOKEN: ${{ secrets.ADVISORY_TOKEN }}
    permissions:
      contents: read
      checks: write
      issues: write
      id-token: write
